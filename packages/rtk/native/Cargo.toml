[package]
name = "jerekode-rtk-plugin"
description = "Native RTK adapter cdylib for Jerekode NativePluginHost"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "jerekode_rtk_plugin"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
jerekode-plugin-sdk = { path = "../../../crates/jerekode-plugin-sdk" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
