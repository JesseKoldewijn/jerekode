[package]
name = "jerekode-server"
description = "HTTP server with v1/v2 adapter layer for Jerekode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true }
jerekode-config = { workspace = true }
jerekode-core = { workspace = true }
jerekode-plugins = { workspace = true, default-features = false }
jerekode-providers = { workspace = true }
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = ["bun-sidecar"]
bun-sidecar = ["jerekode-plugins/bun-sidecar"]

[dev-dependencies]
http-body-util = "0.1"
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
