[package]
name = "jerekode-cli"
description = "Jerekode command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "jerekode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
jerekode-config = { workspace = true }
jerekode-core = { workspace = true }
jerekode-plugins = { workspace = true, default-features = false }
jerekode-providers = { workspace = true }
jerekode-server = { workspace = true, default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["bun-sidecar"]
# Full build (default): Bun sidecar spawn/load paths compiled in.
# Native-only: `cargo build -p jerekode-cli --no-default-features`
bun-sidecar = ["jerekode-plugins/bun-sidecar", "jerekode-server/bun-sidecar"]
native-tui = ["jerekode-plugins/native-tui"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
