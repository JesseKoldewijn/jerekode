[package]
name = "jerekode-cli"
description = "Jerekode command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "jerekode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
jerekode-config = { workspace = true }
jerekode-core = { workspace = true }
jerekode-plugins = { workspace = true }
jerekode-providers = { workspace = true }
jerekode-server = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
native-tui = ["jerekode-plugins/native-tui"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
