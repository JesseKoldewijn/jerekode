name: Release

# Auto-release on every push/merge to main (PromptComposer-style): bump to
# 0.0.<N+1> (next patch from Cargo.toml), commit, build, publish GitHub Release.
# Workspace seed after history wipe is 0.0.1; each main release increments the patch.
# Also supports tag push (v*) and workflow_dispatch.
# PR builds live in pr-build.yml and never create releases.
# Include [skip release] in a commit message to skip the main-push path.
#
# With branch protection (require PR), the default path is:
#   bump on release/sync-0.0.N → close older sync PRs → open labeled sync PR → auto-merge →
#   build/publish from the bumped commit (does not wait for the sync PR).
# Optional secret RELEASE_PUSH_TOKEN (admin PAT) restores a direct push to main.
#
# Release notes: static install/artifact body + filtered GitHub notes since the
# previous tag only (no unfiltered whole-history notes / New Contributors).

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (default: workspace.package.version from Cargo.toml)"
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve / bump version
    # Loop prevention: sync-PR squash/merges include [skip release] in the commit message.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      short_sha: ${{ steps.ver.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On main auto-release, check out main so the version bump can push.
          # GITHUB_TOKEN pushes do not retrigger workflows.
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.sha }}
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve or bump version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail
          chmod +x scripts/set-version.sh

          # CRLF-safe: Python universal newlines via set-version.sh --print
          # (awk `$0 == "[workspace.package]"` fails on CRLF Cargo.toml).
          read_cargo_version() {
            ./scripts/set-version.sh --print
          }

          ensure_release_sync_label() {
            gh label create release-sync \
              --description "Auto version-bump sync from Release workflow" \
              --color 0E8A16 \
              2>/dev/null || true
          }


          close_superseded_sync_prs() {
            local keep_branch="$1"
            local nums
            nums="$(gh pr list --state open --label release-sync --json number,headRefName               --jq ".[] | select(.headRefName != \"${keep_branch}\") | .number" 2>/dev/null || true)"
            while read -r num; do
              [[ -z "${num}" ]] && continue
              gh pr close "${num}" --comment "Superseded by \`${keep_branch}\` (newer auto-release sync)."                 || echo "::warning::Could not close superseded sync PR #${num}"
            done <<< "${nums}"
          }

          open_sync_pr_with_automerge() {
            local version="$1"
            local tag="$2"
            local branch="release/sync-${version}"

            close_superseded_sync_prs "${branch}"

            if ! git push --force-with-lease origin "HEAD:refs/heads/${branch}"; then
              echo "::error::Failed to push ${branch}; cannot publish without a reachable commit."
              exit 1
            fi

            ensure_release_sync_label

            local pr_url=""
            if pr_url="$(gh pr view "${branch}" --json url -q .url 2>/dev/null)"; then
              echo "Sync PR for ${branch} already exists: ${pr_url}"
            else
              local body
              body="Auto version bump from the Release workflow after merge to main (label \`release-sync\`). Keeps Cargo.toml aligned with ${tag}. Commit/title include \`[skip release]\` so merging does not start another release. Auto-merge (squash) is enabled; merges when required checks pass. Build/publish in this run uses the bumped commit and does not wait for the sync PR."
              # Requires repo setting: Actions → General → Workflow permissions →
              # "Allow GitHub Actions to create and approve pull requests" (write).
              if ! pr_url="$(gh pr create \
                --base main \
                --head "${branch}" \
                --title "chore: release ${tag} [skip release]" \
                --label release-sync \
                --body "${body}" 2>&1)"; then
                echo "::warning::Failed to open sync PR for ${branch}: ${pr_url}"
                echo "::warning::Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or set RELEASE_PUSH_TOKEN. Branch was pushed; open the PR manually. Continuing build/publish from bumped SHA."
                return 0
              fi
              echo "Opened sync PR: ${pr_url}"
            fi

            # Enable auto-merge once required checks (rust, bun-sidecar) are green.
            if gh pr merge --auto --squash "${branch}"; then
              echo "Enabled auto-merge (squash) for ${branch}."
            else
              echo "::warning::Could not enable auto-merge for ${branch}. Merge manually after checks pass."
            fi
          }

          CARGO_VERSION="$(read_cargo_version)"
          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/main ]]; then
            # Post-wipe scheme: stay on 0.0.x and increment patch from Cargo.toml.
            # Do not use github.run_number — it survives the version wipe and
            # produced jumps like 0.0.1 → 0.0.22+.
            if [[ "${CARGO_VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              echo "Unexpected Cargo.toml version '${CARGO_VERSION}' (want X.Y.Z)" >&2
              exit 1
            fi
            if [[ "${MAJOR}.${MINOR}" != "0.0" ]]; then
              echo "::warning::Expected 0.0.x line after wipe; got ${CARGO_VERSION}. Still bumping patch only."
            fi
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            TAG="v${VERSION}"
            ./scripts/set-version.sh "${VERSION}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Scope the dirty check to version files only. A whole-tree
            # `git diff --quiet` fails on CRLF noise in the working copy and
            # then `git commit` errors with "nothing to commit".
            if git diff --quiet -- Cargo.toml Cargo.lock; then
              echo "Version already ${VERSION}; reusing HEAD"
            else
              git add Cargo.toml Cargo.lock
              if git diff --cached --quiet; then
                echo "Version already ${VERSION} after normalize; reusing HEAD"
              else
                # [skip release] so a sync-PR squash/merge does not re-trigger Release.
                git commit -m "chore: release ${TAG} [skip release]"

                if [[ "${HAS_PUSH_TOKEN}" == "true" ]] && git push origin HEAD:main; then
                  echo "Pushed version bump to main via RELEASE_PUSH_TOKEN (PromptComposer-style)."
                else
                  if [[ "${HAS_PUSH_TOKEN}" == "true" ]]; then
                    echo "::warning::RELEASE_PUSH_TOKEN push to main failed; falling back to sync PR + auto-merge."
                  else
                    echo "Using sync PR + auto-merge (branch protection / no RELEASE_PUSH_TOKEN)."
                  fi
                  open_sync_pr_with_automerge "${VERSION}" "${TAG}"
                fi
              fi
            fi
          elif [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
              echo "::warning::Tag ${TAG} version (${VERSION}) differs from Cargo.toml (${CARGO_VERSION}); using tag version for artifacts."
            fi
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            VERSION="${CARGO_VERSION}"
            TAG="v${VERSION}"
          fi

          SHA="$(git rev-parse HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release version=${VERSION} tag=${TAG} sha=${SHA}"

  check:
    name: Lint and test
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build test and RTK native plugins
        run: |
          cargo build -p jereko-test-native-plugin --locked
          cargo build -p jereko-rtk-plugin --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Bun workspace tests
        run: |
          bun install
          bun run --filter '@jerekode/sidecar' test
          bun test ./packages/rtk

  build:
    name: Build ${{ matrix.target_os }}-${{ matrix.arch }}
    needs: [prepare, check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Free GitHub-hosted runners. linux-arm64 and windows-arm64 are omitted
          # (no free GHA runners); see docs/releases.md.
          - runner: ubuntu-22.04
            target_os: linux
            arch: x64
          - runner: macos-15-intel
            target_os: macos
            arch: x64
          - runner: macos-14
            target_os: macos
            arch: arm64
          - runner: windows-latest
            target_os: windows
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target_os }}-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install packaging tools (Linux)
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          docker pull archlinux:latest || true

      - name: Build release binary
        shell: bash
        run: cargo build --release -p jereko-cli --locked

      - name: Package artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_OS: ${{ matrix.target_os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          if [[ "${TARGET_OS}" == "windows" ]]; then
            BIN="target/release/jereko.exe"
          else
            BIN="target/release/jereko"
          fi
          STEM="jereko-${VERSION}-release-${TARGET_OS}-${ARCH}"
          mkdir -p dist
          ./scripts/package-release.sh "${STEM}" "${BIN}" dist release

      - name: Package installers
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_OS: ${{ matrix.target_os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-installers.sh
          if [[ "${TARGET_OS}" == "windows" ]]; then
            BIN="target/release/jereko.exe"
          else
            BIN="target/release/jereko"
          fi
          ./scripts/package-installers.sh "${TARGET_OS}" "${ARCH}" "${BIN}" dist "${VERSION}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jereko-${{ needs.prepare.outputs.version }}-release-${{ matrix.target_os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, check, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jereko-${{ needs.prepare.outputs.version }}-release-*
          path: dist
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: ls -la dist

      - name: Build release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/filter-release-notes.py

          cat > /tmp/release-notes.md <<EOF
          Release **jereko ${VERSION}** at \`${SHA}\` (\`${SHORT_SHA}\`).

          ### Artifacts
          Portable archives: \`jereko-{version}-release-{os}-{arch}\` (\`.tar.gz\` / \`.zip\`).

          **Installers (unsigned pre-1.0):**
          - **Windows:** \`jereko-{version}-release-windows-x64-setup.exe\` or stable \`jereko-x64-setup.exe\`
          - **Linux:** \`.deb\`, \`.rpm\`, \`.AppImage\`, Arch \`.pkg.tar.zst\` (plus \`.tar.gz\`)
          - **macOS:** \`.pkg\` (plus \`.tar.gz\`)

          Install examples: \`pacman -U …pkg.tar.zst\`, \`sudo dpkg -i …deb\`, run NSIS setup on Windows.

          ### Platforms
          - linux x64 (deb, rpm, AppImage, Arch pkg, tarball)
          - macos x64 / arm64 (pkg + tarball)
          - windows x64 (NSIS + zip)

          Bun sidecar sources are **not** bundled — see \`sidecar/README.md\` and [docs/releases.md](docs/releases.md).

          Version \`0.0.<n>\` increments the patch on every successful \`main\` auto-release (seed after wipe: \`0.0.1\` → \`0.0.2\` → …). Include \`[skip release]\` in a merge commit message to skip publishing.
          EOF
          # Strip the common leading indent from the heredoc above.
          sed -i -E 's/^[[:space:]]{10}//' /tmp/release-notes.md

          PREV_TAG="$(git tag -l 'v*' --sort=-version:refname | grep -vxF "${TAG}" | head -n1 || true)"
          if [[ -n "${PREV_TAG}" ]]; then
            echo "Previous tag for notes: ${PREV_TAG}"
            FILTERED="$(
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="${TAG}" \
                -f target_commitish="${SHA}" \
                -f previous_tag_name="${PREV_TAG}" \
                --jq .body \
                | ./scripts/filter-release-notes.py
            )"
            if [[ -n "${FILTERED}" ]]; then
              printf '\n%s\n' "${FILTERED}" >> /tmp/release-notes.md
            else
              printf '\n### Changes\nAll generated notes were filtered (sync/bot/[skip release]). See history for %s.\n' "${TAG}" >> /tmp/release-notes.md
            fi
          else
            echo "No previous v* tag; publishing static body only."
            printf '\n### Changes\nFirst release on this version line (or no prior tag). See commit history for %s.\n' "${TAG}" >> /tmp/release-notes.md
          fi

          echo "----- release notes preview -----"
          cat /tmp/release-notes.md
          echo "---------------------------------"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: jereko ${{ needs.prepare.outputs.version }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') || contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'rc') }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
