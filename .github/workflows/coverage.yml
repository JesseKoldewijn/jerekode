name: Coverage

# Sticky PR comment with Rust (+ informational Bun) coverage.
# Gates on diff coverage of changed lines vs origin/main (default 80%).
# Complements CI jobs rust / bun-sidecar; does not replace them.

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  DIFF_COVERAGE_FAIL_UNDER: "80"
  COMPARE_BRANCH: origin/main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install Bun workspace dependencies
        run: bun install

      - name: Build native plugins (coverage tests need dylibs)
        run: |
          cargo build -p jereko-test-native-plugin --locked
          cargo build -p jereko-rtk-plugin --locked

      - name: Run coverage + diff gate
        id: cov
        continue-on-error: true
        run: |
          chmod +x scripts/coverage.sh
          scripts/coverage.sh
        env:
          CI: "true"
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            target/coverage/**
          if-no-files-found: warn

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -f target/coverage/comment.md ]]; then
            cat target/coverage/comment.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage comment missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upsert sticky PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- jereko-coverage-sticky -->"
        run: |
          set -euo pipefail
          BODY_FILE=target/coverage/comment.md
          if [[ ! -f "$BODY_FILE" ]]; then
            echo "No coverage comment to post"
            exit 0
          fi

          EXISTING="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n1 || true)"

          PAYLOAD="$(jq -n --rawfile body "$BODY_FILE" '{body: $body}')"
          if [[ -n "${EXISTING}" ]]; then
            echo "${PAYLOAD}" | gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${EXISTING}" --input -
            echo "Updated sticky coverage comment ${EXISTING}"
          else
            echo "${PAYLOAD}" | gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
            echo "Posted sticky coverage comment"
          fi

      - name: Enforce diff coverage gate
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.cov.outcome }}" != "success" ]]; then
            echo "Diff coverage gate failed (threshold ${DIFF_COVERAGE_FAIL_UNDER}% of changed lines)."
            exit 1
          fi
