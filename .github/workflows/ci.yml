name: CI

# Required branch-protection checks: rust, bun-sidecar (job ids).
# No paths/paths-ignore filters — every PR to main must run both jobs so
# required checks are never left pending on docs-only changes.
#
# pull_request is what attaches checks to the PR. workflow_dispatch is optional
# for manual re-runs on a branch; it does not replace pull_request for merge
# gates. After a GitHub Actions outage, push an empty commit or re-request
# checks once Actions is healthy (see CONTRIBUTING.md).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build test native plugin
        run: cargo build -p jereko-test-native-plugin --locked

      - name: Build RTK native plugin
        run: cargo build -p jereko-rtk-plugin --locked

      - name: Test
        run: cargo test --workspace --locked

  bun-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install workspace dependencies
        run: bun install

      - name: Typecheck sidecar
        working-directory: sidecar
        run: bun run check

      - name: Test sidecar
        working-directory: sidecar
        run: bun test

      - name: Typecheck RTK package
        working-directory: packages/rtk
        run: bun run check

      - name: Test RTK package
        working-directory: packages/rtk
        run: bun test
