[workspace]
members = [
    "crates/jerekode-core",
    "crates/jerekode-config",
    "crates/jerekode-server",
    "crates/jerekode-cli",
    "crates/jerekode-providers",
    "crates/jerekode-plugins",
    "crates/jerekode-plugin-sdk",
    "crates/jerekode-test-native-plugin",
    "packages/rtk/native",
    "conformance",
]
resolver = "2"

[workspace.package]
version = "0.0.15"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jerekode Contributors"]
repository = "https://github.com/JesseKoldewijn/jerekode"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jerekode-config = { path = "crates/jerekode-config" }
jerekode-core = { path = "crates/jerekode-core" }
jerekode-plugins = { path = "crates/jerekode-plugins", default-features = false }
jerekode-providers = { path = "crates/jerekode-providers" }
jerekode-server = { path = "crates/jerekode-server", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
