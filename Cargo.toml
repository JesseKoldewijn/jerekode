[workspace]
members = [
    "crates/jereko-core",
    "crates/jereko-config",
    "crates/jereko-server",
    "crates/jereko-cli",
    "crates/jereko-providers",
    "crates/jereko-plugins",
    "crates/jereko-plugin-sdk",
    "crates/jereko-test-native-plugin",
    "conformance",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jereko Contributors"]
repository = "https://github.com/JesseKoldewijn/jerekode"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jereko-config = { path = "crates/jereko-config" }
jereko-core = { path = "crates/jereko-core" }
jereko-plugins = { path = "crates/jereko-plugins" }
jereko-providers = { path = "crates/jereko-providers" }
jereko-server = { path = "crates/jereko-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
